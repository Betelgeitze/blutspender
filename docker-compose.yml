services:
  database:
    image: 'postgres:16'
    restart: unless-stopped
    env_file: ./.env
    # Not published to the host. bot/parser/sender reach it over the compose
    # network as "database". Publishing 5432 on a public VPS exposes Postgres to
    # the internet. Uncomment the loopback bind below only for local psql access.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
    # No cap_drop here: the postgres entrypoint starts as root to fix up the data
    # directory and needs CHOWN/SETUID/SETGID before it drops to the postgres user.
    security_opt: &no_new_privs
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: Dockerfile-bot
    image: 'blutspender/bot'
    restart: unless-stopped
    env_file: ./.env
    environment: &app_env
      DB_HOST: database
      PORT_ID: 5432
      PYTHONUNBUFFERED: 1
      TZ: Europe/Berlin
    # The images run as uid 10001, so nothing here needs a capability.
    security_opt: *no_new_privs
    cap_drop: &drop_all_caps
      - ALL
    # Ceilings, not tuned working-set sizes: they stop one runaway container from
    # taking the box down with it. Raise if a job gets OOM-killed.
    mem_limit: 1g
    # Webhook mode listens on 8080, reachable only from caddy over the compose
    # network. Deliberately not published: a bot port open on the host would take
    # updates straight from anyone who found it, bypassing TLS.
    expose:
      - "8080"
    depends_on:
      database:
        condition: service_healthy
    logging: *logging

  # TLS terminator for webhook mode. Held behind the "webhook" profile so a
  # polling deployment never starts it — COMPOSE_PROFILES in .env turns it on.
  caddy:
    image: 'caddy:2-alpine'
    profiles: ["webhook"]
    restart: unless-stopped
    env_file: ./.env
    # 80 is not optional: Let's Encrypt validates over HTTP-01 there, and Caddy
    # also uses it to redirect to HTTPS. 443 is where Telegram actually posts.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates live here. Without this volume every restart asks
      # Let's Encrypt for a new one and you hit the rate limit within a day.
      - caddy_data:/data
      - caddy_config:/config
    # Caddy runs as root in this image, but binding 80/443 is the only privilege
    # it actually needs — so drop everything else. Its data lives in root-owned
    # volumes, which it can still reach without DAC_OVERRIDE.
    security_opt: *no_new_privs
    cap_drop: *drop_all_caps
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    depends_on:
      - bot
    logging: *logging

  # One-shot jobs. Held behind a profile so "docker compose up" does not start
  # them; cron invokes them with "docker compose run --rm parser".
  parser:
    build:
      context: .
      dockerfile: Dockerfile-parser
    image: 'blutspender/parser'
    profiles: ["jobs"]
    restart: "no"
    env_file: ./.env
    environment: *app_env
    security_opt: *no_new_privs
    cap_drop: *drop_all_caps
    mem_limit: 1536m
    depends_on:
      database:
        condition: service_healthy
    logging: *logging

  sender:
    build:
      context: .
      dockerfile: Dockerfile-sender
    image: 'blutspender/sender'
    profiles: ["jobs"]
    restart: "no"
    env_file: ./.env
    environment: *app_env
    security_opt: *no_new_privs
    cap_drop: *drop_all_caps
    mem_limit: 768m
    depends_on:
      database:
        condition: service_healthy
    logging: *logging

volumes:
  data:
  caddy_data:
  caddy_config:
